<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>A Database Place - Simpsons Dashboard</title>
<script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
<style>
  body {
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    max-width: 900px;
    margin: 40px auto;
    padding: 20px;
    color: #2c2c2a;
    background-color: #ffffff;
  }
  h1 { font-size: 22px; font-weight: 500; margin-bottom: 4px; }
  p.subtitle { color: #666; margin-top: 0; margin-bottom: 24px; font-size: 14px; }

  .stats-bar {
    display: flex;
    gap: 12px;
    margin-bottom: 28px;
    flex-wrap: wrap;
  }
  .stat-card {
    flex: 1;
    min-width: 130px;
    background-color: #A9D0F5;
    border-radius: 8px;
    padding: 14px 16px;
    text-align: center;
  }
  .stat-number {
    font-size: 22px;
    font-weight: 600;
    color: #2c2c2a;
  }
  .stat-source .stat-number {
    font-size: 15px;
    font-weight: 500;
  }
  .stat-label {
    font-size: 12px;
    color: #555;
    margin-top: 4px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }

  .tabs {
    display: flex;
    gap: 4px;
    border-bottom: 1px solid #e2e2e2;
    margin-bottom: 24px;
  }
  .tab-btn {
    border: none;
    background: none;
    padding: 10px 16px;
    font-size: 14px;
    font-weight: 500;
    color: #888;
    border-bottom: 2px solid transparent;
    cursor: pointer;
  }
  .tab-btn.active {
    color: #2c2c2a;
    border-bottom: 2px solid #f5c518;
  }

  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  .slider-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
  }
  .slider-row label { font-size: 13px; color: #555; white-space: nowrap; }
  .slider-row input[type=range] { flex: 1; accent-color: #7ec8e3; }
  .slider-row span { font-size: 13px; font-weight: 500; min-width: 20px; }

  .toggle-row {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  .toggle-btn {
    border: 1px solid #d7e6f5;
    background: #ffffff;
    color: #555;
    padding: 6px 14px;
    font-size: 13px;
    font-weight: 500;
    border-radius: 20px;
    cursor: pointer;
  }
  .toggle-btn.active {
    background: #A9D0F5;
    border-color: #A9D0F5;
    color: #2c2c2a;
  }

  #chart { width: 100%; height: 480px; }
</style>
</head>
<body>

<h1>A Database Place</h1>
<p class="subtitle">Exploring The Simpsons dataset</p>

<div class="stats-bar">
  <div class="stat-card">
    <div class="stat-number">1,182</div>
    <div class="stat-label">Characters</div>
  </div>
  <div class="stat-card">
    <div class="stat-number">768</div>
    <div class="stat-label">Episodes</div>
  </div>
  <div class="stat-card">
    <div class="stat-number">477</div>
    <div class="stat-label">Locations</div>
  </div>
  <div class="stat-card stat-source">
    <div class="stat-number">thesimpsonsapi.com</div>
    <div class="stat-label">Data Source</div>
  </div>
</div>

<div class="tabs">
  <button class="tab-btn active" data-tab="episodes">Episodes</button>
  <button class="tab-btn" data-tab="characters">Characters</button>
  <button class="tab-btn" data-tab="locations">Locations</button>
</div>

<div id="panel-episodes" class="tab-panel active">
  <div class="slider-row">
    <label>Show seasons up to:</label>
    <input type="range" id="seasonSlider" min="1" max="35" value="35">
    <span id="seasonValue">35</span>
  </div>
</div>

<div id="panel-characters" class="tab-panel">
  <div class="toggle-row">
    <button class="toggle-btn active" data-view="status">By Status</button>
    <button class="toggle-btn" data-view="quotes">Most Quoted</button>
  </div>
</div>

<div id="chart"></div>

<script>
const episodesData = [{"season": 1, "count": 13}, {"season": 2, "count": 22}, {"season": 3, "count": 24}, {"season": 4, "count": 22}, {"season": 5, "count": 22}, {"season": 6, "count": 25}, {"season": 7, "count": 25}, {"season": 8, "count": 25}, {"season": 9, "count": 25}, {"season": 10, "count": 23}, {"season": 11, "count": 22}, {"season": 12, "count": 21}, {"season": 13, "count": 22}, {"season": 14, "count": 22}, {"season": 15, "count": 22}, {"season": 16, "count": 21}, {"season": 17, "count": 22}, {"season": 18, "count": 22}, {"season": 19, "count": 20}, {"season": 20, "count": 21}, {"season": 21, "count": 23}, {"season": 22, "count": 22}, {"season": 23, "count": 22}, {"season": 24, "count": 22}, {"season": 25, "count": 22}, {"season": 26, "count": 22}, {"season": 27, "count": 22}, {"season": 28, "count": 22}, {"season": 29, "count": 21}, {"season": 30, "count": 23}, {"season": 31, "count": 22}, {"season": 32, "count": 22}, {"season": 33, "count": 22}, {"season": 34, "count": 22}, {"season": 35, "count": 18}];
const charactersData = [{"gender": "Male", "count": 741}, {"gender": "Female", "count": 330}, {"gender": "Unknown", "count": 111}];
const statusData = [{"status": "Alive", "count": 855}, {"status": "Deceased", "count": 136}, {"status": "Unknown", "count": 126}, {"status": "Fictional", "count": 50}, {"status": "Noncanon", "count": 9}, {"status": "Noncanon Deceased", "count": 4}, {"status": "Destroyed Icon", "count": 2}];
const quotesData = [{"name": "Homer Simpson", "count": 15}, {"name": "Lisa Simpson", "count": 13}, {"name": "Fat Tony", "count": 11}, {"name": "Milhouse Van Houten", "count": 10}, {"name": "Bart Simpson", "count": 8}, {"name": "Groundskeeper Willie", "count": 8}, {"name": "Charles Montgomery Burns", "count": 7}, {"name": "Moe Szyslak", "count": 7}, {"name": "Clancy Wiggum", "count": 7}, {"name": "Apu Nahasapeemapetilon", "count": 6}];
const locationsData = [{"word": "Springfield", "count": 98}, {"word": "House", "count": 13}, {"word": "Center", "count": 12}, {"word": "Evergreen", "count": 10}, {"word": "Terrace", "count": 10}, {"word": "Street", "count": 8}, {"word": "School", "count": 7}, {"word": "City", "count": 7}, {"word": "Shop", "count": 7}, {"word": "Stadium", "count": 6}];

const commonLayout = {
  template: "plotly_white",
  dragmode: false,
  margin: { t: 40, r: 20, l: 50, b: 70 },
  paper_bgcolor: "#ffffff",
  plot_bgcolor: "#A9D0F5",
};
const commonConfig = {
  displayModeBar: false,
  scrollZoom: false,
  responsive: true,
};

function renderEpisodes(maxSeason) {
  const filtered = episodesData.filter(d => d.season <= maxSeason);
  Plotly.newPlot("chart", [{
    x: filtered.map(d => d.season),
    y: filtered.map(d => d.count),
    type: "bar",
    marker: { color: "#f5c518" },
    text: filtered.map(d => d.count),
    textposition: "outside",
    textfont: { color: "#2c2c2a" },
    hovertemplate: "Season %{x}<br>%{y} episodes<extra></extra>",
  }], {
    ...commonLayout,
    title: "Episodes per season",
    xaxis: {
      title: "Season",
      tickmode: "linear",
      dtick: 1,
      tickangle: -90,
      fixedrange: true,
    },
    yaxis: { title: "Number of episodes", fixedrange: true, rangemode: "tozero" },
  }, commonConfig);
}

function renderCharactersStatus() {
  Plotly.newPlot("chart", [{
    x: statusData.map(d => d.status),
    y: statusData.map(d => d.count),
    type: "bar",
    marker: { color: "#ffdd00" },
    text: statusData.map(d => d.count),
    textposition: "outside",
    textfont: { color: "#2c2c2a" },
    hovertemplate: "%{x}<br>%{y} characters<extra></extra>",
  }], {
    ...commonLayout,
    title: "Characters by status",
    xaxis: { title: "", fixedrange: true, tickangle: -20 },
    yaxis: { title: "Number of characters", fixedrange: true },
  }, commonConfig);
}

function renderCharactersQuotes() {
  const sorted = [...quotesData].sort((a, b) => a.count - b.count);
  Plotly.newPlot("chart", [{
    x: sorted.map(d => d.count),
    y: sorted.map(d => d.name),
    type: "bar",
    orientation: "h",
    marker: { color: "#ffdd00" },
    text: sorted.map(d => d.count),
    textposition: "outside",
    textfont: { color: "#2c2c2a" },
    hovertemplate: "%{y}<br>%{x} phrases<extra></extra>",
  }], {
    ...commonLayout,
    title: "Top 10 most-quoted characters",
    margin: { t: 40, r: 30, l: 180, b: 50 },
    xaxis: { title: "Number of phrases logged", fixedrange: true },
    yaxis: { title: "", fixedrange: true },
  }, commonConfig);
}

let charactersView = "status";
function renderCharacters() {
  if (charactersView === "status") renderCharactersStatus();
  else renderCharactersQuotes();
}

function renderLocations() {
  Plotly.newPlot("chart", [{
    x: locationsData.map(d => d.word),
    y: locationsData.map(d => d.count),
    type: "bar",
    marker: { color: "#ffdd00" },
    text: locationsData.map(d => d.count),
    textposition: "outside",
    textfont: { color: "#2c2c2a" },
    hovertemplate: "%{x}<br>appears in %{y} location names<extra></extra>",
  }], {
    ...commonLayout,
    title: "Most common words in location names",
    xaxis: { title: "", fixedrange: true, tickangle: -20 },
    yaxis: { title: "Number of locations", fixedrange: true },
  }, commonConfig);
}

// Tab switching
document.querySelectorAll(".tab-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    document.querySelectorAll(".tab-panel").forEach(p => p.classList.remove("active"));
    btn.classList.add("active");
    const tab = btn.dataset.tab;
    const panel = document.getElementById("panel-" + tab);
    if (panel) panel.classList.add("active");

    if (tab === "episodes") renderEpisodes(parseInt(document.getElementById("seasonSlider").value));
    else if (tab === "characters") renderCharacters();
    else if (tab === "locations") renderLocations();
  });
});

// Character view toggle
document.querySelectorAll(".toggle-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".toggle-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    charactersView = btn.dataset.view;
    renderCharacters();
  });
});

// Season slider
const slider = document.getElementById("seasonSlider");
slider.addEventListener("input", () => {
  document.getElementById("seasonValue").textContent = slider.value;
  renderEpisodes(parseInt(slider.value));
});

// Initial render
renderEpisodes(35);
</script>

</body>
</html>
